name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/guesthoster
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/guesthoster
      AUTH_SECRET: ci-build-secret-placeholder-minimum-32-chars

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript & Lint
        run: |
          npm run types:check
          npm run lint

      - name: Unit Tests
        run: npm test

      - name: Production Build
        run: npm run build
